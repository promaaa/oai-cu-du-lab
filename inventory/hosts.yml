      older_management: 10.76.170.100
      wifi_observed: 10.85.168.144
      quectel_observed: 10.0.0.3
      wireguard_candidate: 10.250.0.2
      usrp_x310_default_subnet: 192.168.10.1
    username: serber
    attached_equipment:
      - USRP B210
      - Quectel RM500Q-GL
      - USRP X310
    validation_purpose: du_access_radio_and_backhaul_experiments
    status: confirmed_baseline_with_migration_in_progress
    notes: "USRP B210 serial 8002816 remains the confirmed access-cell rollback radio with PCI=0, TAC=1, DU ID 0xe01. Use direct SSH target serber@10.76.170.40 when aliases drift. Quectel remains the documented modem-backhaul target. USRP X310 is an experimental migration candidate and is not yet a replacement baseline."

  serber-pi:
    role:
      - experimental-lightweight-du
      - active-du-candidate
    known_addresses:
      ethernet: 10.76.170.18
      wifi: "currently down during 2026-07-01 check; older evidence used 10.85.44.93"
      quectel_observed: 10.0.0.2
      wireguard_candidate: 10.250.0.2
    username: serber
    attached_equipment:
      - USRP B210 (serial 8002816, physically active)
    validation_purpose: raspberry_pi_5_du_migration
    status: prepared_in_tui_requires_fresh_live_validation
    notes: "Raspberry Pi 5 DU benchmarks are prepared in the TUI. Current direct SSH target is serber@10.76.170.18. Current evidence supports the Pi+B210 106 PRB runtime shape with -E at 46.08 MSps; commercial UE attachment and throughput require fresh synchronized validation before promotion to a baseline."

  oai-pc:
