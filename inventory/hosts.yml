      - experimental-du-candidate
      - historical-inventory-only
    known_addresses:
      management: "unknown (discovery required: try 10.76.170.90 or oai-pc hostname)"
      older_oai_alias: 10.76.170.90
      oai_cn_bridge: "192.168.70.x (docker network, to be confirmed)"
    username: unknown (same as serber hosts?)
    attached_equipment:
      - USRP B210 (to be confirmed, serial unknown)
    validation_purpose: historical host inventory only; not part of Quectel backhaul
    status: partial — discovery and validation pending
    notes: "Older docs used this host for experiments. The current Quectel F1 backhaul target does not use oai-pc; the supported donor is the firecell monolithic donor gNB."
