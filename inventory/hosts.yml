hosts:
  serber-firecell:
    role:
      - core-network
      - cu
      - quectel-donor-gnb-host
    known_addresses:
      management: 10.76.170.38
      oai_cn_host: 192.168.71.129
      amf_container: 192.168.71.132
    username: serber
    attached_equipment:
      - firecell USRP for outside donor gNB
    validation_purpose: core_cu_and_monolithic_donor_gnb_for_quectel_backhaul
