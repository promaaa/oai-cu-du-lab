scenarios:
  monolithic_reference:
    label: "Monolithic reference"
    status: verified_gated_tui_reference
    roles:
      serber-firecell: "Core Network + monolithic gNB + local USRP"
    rollback_target: false
    pws_supported: true
    restart_required_after_pws_apply: true
    default_oai_commit: unknown
    evidence_requirement:
      - ssh
      - repository_commit
      - config_file
      - live_minipc_management_ip_and_interface_for_split_cleanup
      - usrp_detection
      - monolithic_core_health
      - ng_setup_response
      - sib8_pws_log_milestone
      - radio_sync
      - no_live_minipc_du_or_split_core
      - no_split_f1_on_ethernet_or_wireguard
      - phone_throughput_entry

  ethernet_cu_du_sib8:
    label: "Ethernet CU/DU with SIB8"
    status: verified_rollback_baseline
    roles:
      serber-firecell: "Core Network + CU"
      serber-minipc: "DU + USRP access radio"
    rollback_target: true
    pws_supported: true
    restart_required_after_pws_apply: true
    default_oai_commit: "102965a669b9444857c27843ec8ce62780bf9d37"
    evidence_requirement:
      - ssh
      - repository_commit
      - config_files
      - live_minipc_management_ip_and_interface
      - runtime_du_config_with_live_f1_ip
      - du_usrp_detection
      - f1_log_milestone
      - f1_c_sctp_on_ethernet
      - no_f1_on_wifi_quectel_or_wireguard
      - phone_pws_observation
      - phone_throughput_entry

  rpi_du:
    label: "Raspberry Pi CU/DU benchmarks"
    status: prepared_in_tui_requires_fresh_live_validation
    roles:
      serber-firecell: "Core Network + CU"
      serber-pi: "experimental DU + radio"
    benchmark_profiles:
      ethernet_f1:
        tui_command: "./scripts/oai-lab-tui --pi-ethernet --start-ethernet"
        selected_transport: ethernet
      wifi_gre_f1:
        tui_command: "PI_WIFI_IP=<pi-wifi-ip> ./scripts/oai-lab-tui --pi-wifi-gre --start-wifi-gre"
        selected_transport: test-gre
      quectel_wireguard_f1:
        tui_command: "./scripts/oai-lab-tui --pi-quectel-wg --start-quectel-wg"
        selected_transport: wg-quectel-f1
    rollback_target: false
    pws_supported: true
    restart_required_after_pws_apply: true
    evidence_requirement:
      - ssh
      - usrp_detection
      - cpu_ram
      - temperature
      - throttling
      - selected_f1_transport_prepared
      - runtime_cu_du_configs_with_selected_f1_ips
      - f1_log_milestone
      - f1_c_sctp_on_selected_transport
      - no_f1_on_non_selected_paths
      - phone_pws_observation
      - phone_throughput_entry
      - ethernet_rollback_rechecked_after_benchmark

  oai_pc_du:
    label: "CU/DU split with oai-pc"
    status: unverified_blocked_until_host_inventory_and_commands_are_recorded
    roles:
      serber-firecell: "Core Network + CU"
      oai-pc: "powerful DU candidate"
    rollback_target: false
    pws_supported: unknown
    restart_required_after_pws_apply: true
    evidence_requirement:
      - ssh
      - repository_paths
      - config_files
      - interfaces
      - usrp_detection
      - launch_commands

  nrue_internet_radio:
    label: "Internet through radio: firecell gNB + minipc nrUE"
    status: unverified_blocked_until_validated_commands_are_recovered
    roles:
      serber-firecell: "Core Network/control side; exact validated gNB command not recovered"
      serber-minipc: "OAI nrUE candidate and radio host"
    rollback_target: false
    pws_supported: false
    restart_required_after_pws_apply: true
    evidence_requirement:
      - conflicting_process_check
      - gnb_start_log
      - nrue_start_log
      - ue_tunnel_interface
      - route_evidence
      - connectivity_bound_to_tunnel

  caged_quectel_f1_backhaul:
    label: "Caged Quectel F1 Backhaul, Monolithic Donor"
    status: gated_launch_runtime_validation_required
    roles:
      serber-firecell: "one 5GC + one CU + monolithic donor gNB for Quectel"
      serber-minipc: "caged access DU + B210 serial 8002816 + Quectel PDU backhaul"
    rollback_target: false
    pws_supported: true
    restart_required_after_pws_apply: true
    default_oai_commit: "102965a669b9444857c27843ec8ce62780bf9d37"
    runbook: "docs/quectel-f1-backhaul/single-cu-firecell-donor-launch-runbook.md"
    evidence_requirement:
      - live_minipc_management_ip_and_interface
      - live_quectel_interface_pdu_ip_and_gateway
      - firecell_core_health
      - firecell_monolithic_donor_gnb_in_service_with_pci_1_tac_2
      - wireguard_handshake_and_tunnel_ping
      - shared_cu_two_du_f1_logs
      - f1_c_sctp_on_wg_quectel_f1
      - wireguard_udp_on_quectel_interface
      - f1_u_udp_2153_on_wg_quectel_f1
      - no_f1_on_management_ethernet_or_wifi
      - rollback_readiness_over_management_ssh
