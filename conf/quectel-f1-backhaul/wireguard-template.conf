# WireGuard template for Quectel F1 backhaul
# No private keys committed — generate locally on each host
# Usage: copy to /etc/wireguard/wg-quectel-f1.conf and fill in peer public keys

# ============================================================
# SERBER-FIRECELL (CU + Core, WireGuard SERVER side)
# ============================================================
# Generate keypair on serber-firecell:
#   wg genkey | sudo tee /etc/wireguard/wg-quectel-f1.key
#   sudo wg pubkey < /etc/wireguard/wg-quectel-f1.key  -> gives FIRECELL_PUBLIC_KEY

[Interface]
# WireGuard tunnel IP for CU side
Address = 10.250.0.1/30
# WireGuard listens on this UDP port
# If behind NAT, ensure port forwarding or use a relay
ListenPort = 51821
# Private key — generated locally, never committed
PrivateKey = <firecell-wireguard-private-key>

# Keep the system's default routing (management access stays on Ethernet/WiFi)
Table = auto

[Peer]
# serber-minipc WireGuard public key (from 03_setup_wireguard_minipc.sh output)
PublicKey = <minipc-wireguard-public-key>
AllowedIPs = 10.250.0.2/32

# ============================================================
# SERBER-MINIPC (DU + USRP B210, WireGuard CLIENT side)
# ============================================================
# Generate keypair on serber-minipc:
#   wg genkey | sudo tee /etc/wireguard/wg-quectel-f1.key
#   sudo wg pubkey < /etc/wireguard/wg-quectel-f1.key  -> gives MINIPC_PUBLIC_KEY

[Interface]
# WireGuard tunnel IP for DU side
Address = 10.250.0.2/30
# Private key — generated locally, never committed
PrivateKey = <minipc-wireguard-private-key>

# Prevent silent startup if Quectel is not connected
# PreUp checks that wwan0 has an IPv4 address before bringing up WireGuard

[Peer]
# serber-firecell WireGuard public key
PublicKey = <firecell-wireguard-public-key>
# WireGuard server endpoint — use firecell's OAI CN bridge IP if no public IP
Endpoint = 192.168.71.129:51821
# Only route the WireGuard tunnel IP over the tunnel
# Management traffic stays on Ethernet/WiFi via default route
AllowedIPs = 10.250.0.1/32
# Keepalive to maintain NAT pinhole
PersistentKeepalive = 25

# PostUp: force WireGuard endpoint route through Quectel wwan0
# This ensures the WireGuard handshake goes over the cellular backhaul
PostUp = ip route add 192.168.71.129/32 via <quectel-gateway> dev wwan0 || true
# Policy routing: F1 traffic from the WireGuard tunnel uses table 250
PostUp = ip rule add from 10.250.0.2/32 lookup 250 priority 250 || true
PostUp = ip route add default via 10.250.0.1 dev wg-quectel-f1 table 250 || true

# PostDown: cleanup
PostDown = ip route del 192.168.71.129/32 dev wwan0 2>/dev/null || true
PostDown = ip rule del from 10.250.0.2/32 lookup 250 priority 250 2>/dev/null || true