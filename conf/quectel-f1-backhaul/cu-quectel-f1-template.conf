# Purpose: shared CU for firecell donor DU and minipc access DU

# KEY CHANGE from Ethernet baseline:
#   The CU accepts two DU associations:
#     - firecell donor DU over a local firecell path (127.0.0.2 -> 127.0.0.1)
#     - minipc access DU over WireGuard (10.250.0.2 -> 10.250.0.1)
#   The generated CU config binds F1 broadly and lets routing choose the
#   correct source path for each DU.

