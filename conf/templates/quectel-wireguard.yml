template: quectel-wireguard
purpose: planned Quectel F1 backhaul overlay
status: partial_not_stable_baseline
hosts:
  cu: serber-firecell
  du: serber-minipc
interfaces:
  quectel_data: wwan0
  wireguard: wg-quectel-f1
wireguard:
  cu_ip: 10.250.0.1/30
  du_ip: 10.250.0.2/30
  port: 51821
  private_keys: local_secret_only
quectel:
  modem: Quectel RM500Q-GL
  management_device: /dev/cdc-wdm2
  apn: "<independent-apn>"
  donor_requirement: independent_of_minipc_access_cell
f1:
  cu_bind_ip: 10.250.0.1
  du_bind_ip: 10.250.0.2
  port: 2153
validation_required:
  - f1_c_sctp_on_wireguard
  - f1_u_gtpu_on_wireguard
  - wireguard_udp_on_wwan0
  - no_f1_fallback_on_ethernet_or_wifi
  - stable_cu_du_association
  - commercial_ue_service
guardrails:
  same_cell_full_f1_is_blocked: true
  generated_configs_go_to: conf/generated/
