<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Shared central unit architecture with one validated distributed unit and future UAV distributed units</title>
  <desc id="desc">The OAI 5G Core and central unit stay on the ground. F1 crosses Ethernet, Wi-Fi with GRE, or 5G with WireGuard to an Arm distributed unit and a USRP B210. The B210 serves a commercial handset over NR-Uu. A dashed branch represents future additional UAV distributed units.</desc>
  <defs>
    <style>
      .group-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #16324f; }
      .box-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #16324f; }
      .box-sub { font: 14px Arial, Helvetica, sans-serif; fill: #44546a; }
      .link-label { font: 700 14px Arial, Helvetica, sans-serif; fill: #1f5d8f; }
      .note { font: 13px Arial, Helvetica, sans-serif; fill: #5f6b78; }
      .ground-frame { fill: #f3f8fc; stroke: #4f89b7; stroke-width: 2; }
      .air-frame { fill: #f3fbf6; stroke: #4f9a68; stroke-width: 2; }
      .core-box { fill: #dcecf8; stroke: #2879b3; stroke-width: 2; }
      .cu-box { fill: #d9e9f7; stroke: #2879b3; stroke-width: 2; }
      .du-box { fill: #dff2e5; stroke: #348957; stroke-width: 2; }
      .radio-box { fill: #fff0da; stroke: #d98220; stroke-width: 2; }
      .ue-box { fill: #f7f8fa; stroke: #687889; stroke-width: 2; }
      .transport-box { fill: #ffffff; stroke: #6e879e; stroke-width: 1.5; }
      .future-box { fill: #f7fbf8; stroke: #4f9a68; stroke-width: 2; stroke-dasharray: 8 6; }
      .solid-link { fill: none; stroke: #1f5d8f; stroke-width: 3; }
      .radio-link { fill: none; stroke: #d98220; stroke-width: 3; }
      .future-link { fill: none; stroke: #4f9a68; stroke-width: 2.5; stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5d8f"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d98220"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f9a68"/>
    </marker>
  </defs>

  <rect x="18" y="82" width="342" height="224" rx="14" class="ground-frame"/>
  <text x="38" y="111" class="group-title">Ground - shared functions</text>

  <rect x="42" y="136" width="128" height="112" rx="10" class="core-box"/>
  <text x="106" y="181" text-anchor="middle" class="box-title">OAI 5G Core</text>
  <text x="106" y="207" text-anchor="middle" class="box-sub">shared network</text>

  <rect x="205" y="136" width="130" height="112" rx="10" class="cu-box"/>
  <text x="270" y="177" text-anchor="middle" class="box-title">OAI CU</text>
  <text x="270" y="202" text-anchor="middle" class="box-sub">RRC / PDCP</text>
  <text x="270" y="224" text-anchor="middle" class="box-sub">SDAP</text>

  <path d="M 170 192 L 205 192" class="solid-link" marker-end="url(#arrow-blue)"/>

  <rect x="654" y="82" width="316" height="224" rx="14" class="air-frame"/>
  <text x="674" y="111" class="group-title">UAV-compatible payload</text>

  <rect x="670" y="136" width="122" height="112" rx="10" class="du-box"/>
  <text x="731" y="177" text-anchor="middle" class="box-title">Arm DU 1</text>
  <text x="731" y="202" text-anchor="middle" class="box-sub">MAC / RLC</text>
  <text x="731" y="224" text-anchor="middle" class="box-sub">PHY</text>

  <rect x="836" y="136" width="116" height="112" rx="10" class="radio-box"/>
  <text x="894" y="177" text-anchor="middle" class="box-title">USRP B210</text>
  <text x="894" y="202" text-anchor="middle" class="box-sub">n78 access</text>
  <text x="894" y="224" text-anchor="middle" class="box-sub">106 PRBs</text>

  <path d="M 792 192 L 836 192" class="solid-link" marker-end="url(#arrow-blue)"/>
  <text x="814" y="176" text-anchor="middle" class="note">USB 3</text>

  <path d="M 335 192 L 670 192" class="solid-link" marker-end="url(#arrow-blue)"/>
  <rect x="438" y="154" width="137" height="27" rx="7" class="transport-box"/>
  <text x="506.5" y="173" text-anchor="middle" class="link-label">F1-C / F1-U</text>
  <rect x="395" y="222" width="224" height="57" rx="9" class="transport-box"/>
  <text x="507" y="244" text-anchor="middle" class="box-sub">Ethernet | Wi-Fi/GRE</text>
  <text x="507" y="266" text-anchor="middle" class="box-sub">5G/WireGuard</text>
  <path d="M 507 222 L 507 194" stroke="#6e879e" stroke-width="1.5"/>

  <rect x="1027" y="136" width="148" height="112" rx="10" class="ue-box"/>
  <text x="1101" y="177" text-anchor="middle" class="box-title">Commercial UE</text>
  <text x="1101" y="202" text-anchor="middle" class="box-sub">PWS alert</text>
  <text x="1101" y="224" text-anchor="middle" class="box-sub">and user data</text>

  <path d="M 952 192 L 1027 192" class="radio-link" marker-end="url(#arrow-orange)"/>
  <rect x="960" y="151" width="58" height="26" rx="7" fill="#ffffff" stroke="#d98220" stroke-width="1.5"/>
  <text x="989" y="169" text-anchor="middle" class="link-label" style="fill:#b86714">NR-Uu</text>

  <rect x="646" y="18" width="330" height="42" rx="10" class="future-box"/>
  <text x="811" y="44" text-anchor="middle" class="box-title">Future UAV DUs: DU 2 to DU N</text>
  <path d="M 310 136 C 405 45, 520 39, 646 39" class="future-link" marker-end="url(#arrow-green)"/>

  <text x="600" y="329" text-anchor="middle" class="note">Solid path validated with one DU; dashed branch is architectural scale-out only.</text>
</svg>
